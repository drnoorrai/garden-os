<svg xmlns="http://www.w3.org/2000/svg" width="60in" height="48in" viewBox="0 0 6000 4800">
  <defs>
    <style>
      .bg{fill:#062317;}
      .gold{fill:#d4a64a;stroke:#f2d37a;stroke-width:6;}
      .goldLine{fill:none;stroke:#d4a64a;stroke-width:18;}
      .goldThin{fill:none;stroke:#d4a64a;stroke-width:8;}
      .dim{fill:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:150px;font-weight:700;}
      .brand{font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:110px;}
      .orchard{font-family:Georgia,'Times New Roman',serif;font-weight:500;letter-spacing:145px;}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="22" dy="28" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="goldGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f5d274"/>
      <stop offset="0.45" stop-color="#c89532"/>
      <stop offset="1" stop-color="#f7dc8b"/>
    </linearGradient>
  </defs>

  <!-- 5 ft x 4 ft print panel. Send at 60 in wide x 48 in tall. -->
  <rect width="6000" height="4800" fill="#062317"/>
  <rect x="130" y="130" width="5740" height="4540" rx="18" class="goldLine"/>
  <rect x="210" y="210" width="5580" height="4380" rx="10" class="goldThin"/>

  <!-- Decorative corner details -->
  <path d="M130 520 Q130 130 520 130 M5480 130 Q5870 130 5870 520 M5870 4280 Q5870 4670 5480 4670 M520 4670 Q130 4670 130 4280" class="goldThin"/>
  <circle cx="300" cy="300" r="18" fill="#d4a64a"/><circle cx="5700" cy="300" r="18" fill="#d4a64a"/>
  <circle cx="5700" cy="4500" r="18" fill="#d4a64a"/><circle cx="300" cy="4500" r="18" fill="#d4a64a"/>

  <!-- Main wordmark -->
  <g filter="url(#shadow)">
    <text x="3000" y="2050" text-anchor="middle" class="brand" font-size="1200" fill="url(#goldGrad)">RAI</text>
    <text x="3000" y="3600" text-anchor="middle" class="orchard" font-size="720" fill="url(#goldGrad)">ORCHARDS</text>
  </g>

  <!-- Leaf motif in R -->
  <g transform="translate(2355 1560) rotate(-18)">
    <path d="M0 420 C150 210 300 115 505 70" stroke="#d4a64a" stroke-width="28" fill="none" stroke-linecap="round"/>
    <path d="M135 260 C80 125 150 40 295 35 C300 180 245 260 135 260Z" fill="#d4a64a" stroke="#f2d37a" stroke-width="6"/>
    <path d="M270 165 C260 30 355 -30 500 0 C470 145 390 210 270 165Z" fill="#d4a64a" stroke="#f2d37a" stroke-width="6"/>
    <path d="M330 300 C355 170 465 125 590 190 C515 315 430 360 330 300Z" fill="#d4a64a" stroke="#f2d37a" stroke-width="6"/>
  </g>

  <!-- Leaf motif in A -->
  <g transform="translate(3240 1800) rotate(-14)">
    <path d="M0 330 C165 160 330 80 545 45" stroke="#d4a64a" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M120 205 C80 80 155 10 285 20 C275 145 220 220 120 205Z" fill="#d4a64a" stroke="#f2d37a" stroke-width="6"/>
    <path d="M280 125 C285 5 385 -45 515 0 C470 125 392 178 280 125Z" fill="#d4a64a" stroke="#f2d37a" stroke-width="6"/>
    <path d="M335 245 C365 125 470 92 590 160 C510 275 425 310 335 245Z" fill="#d4a64a" stroke="#f2d37a" stroke-width="6"/>
  </g>

  <!-- Divider -->
  <line x1="1700" y1="2650" x2="4300" y2="2650" stroke="#d4a64a" stroke-width="10"/>
  <polygon points="3000,2580 3070,2650 3000,2720 2930,2650" fill="#d4a64a"/>
  <circle cx="2860" cy="2650" r="14" fill="#d4a64a"/><circle cx="3140" cy="2650" r="14" fill="#d4a64a"/>

  <!-- Optional dimension guide layer: hide/delete before print if desired -->
  <g id="dimension_guides" opacity="0.0">
    <line x1="0" y1="4780" x2="6000" y2="4780" stroke="#fff" stroke-width="16"/>
    <text x="3000" y="4620" text-anchor="middle" class="dim">5 FT LONG</text>
    <line x1="20" y1="0" x2="20" y2="4800" stroke="#fff" stroke-width="16"/>
    <text x="220" y="2400" text-anchor="middle" class="dim" transform="rotate(-90 220 2400)">4 FT TALL</text>
  </g>
</svg>
